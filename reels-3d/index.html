<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; }
      #v3d { position: absolute; inset: 0; width: 1080px; height: 1350px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.4" data-width="1080" data-height="1350">
      <video id="v3d" class="clip" src="assets/video/3d.mp4" data-start="0" data-duration="6.5" data-track-index="0" muted playsinline style="z-index: 1"></video>
      <div id="cta" class="clip" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="6.4" data-duration="3.0" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1350" style="z-index: 2"></div>
      <audio id="muzik" class="clip" src="assets/audio/muzik.mp3" data-start="0" data-track-index="2" data-volume="1.0"></audio>
      <audio id="w1" class="clip" src="assets/audio/whoosh.mp3" data-start="0.9" data-track-index="3" data-volume="0.4"></audio>
      <audio id="w2" class="clip" src="assets/audio/whoosh.mp3" data-start="6.3" data-track-index="4" data-volume="0.45"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
