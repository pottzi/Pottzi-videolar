  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      function build() {
        const N = 91, END = 17.0, DONE = 6.3;
        // sayaç P-0001 -> P-9999
        const bn = document.getElementById("badge-n");
        const c = { v: 1 };
        tl.fromTo(c, { v: 1 }, { v: 9999, duration: DONE - 0.4, ease: "power2.in", onUpdate: () => { bn.textContent = "P-" + String(Math.round(c.v)).padStart(4, "0"); } }, 0.4);

        // mozaik doluyor
        for (let i = 0; i < N; i++) {
          const t = 0.6 + Math.pow(i / N, 0.55) * (DONE - 0.9);
          tl.fromTo("#m" + i, { opacity: 0, scale: 0.6 }, { opacity: 0.45, scale: 1, duration: 0.25, ease: "back.out(2)" }, t);
        }
        // 9999: bitti
        tl.fromTo("#check", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, DONE);
        tl.fromTo("#badge", { x: 0 }, { x: -12, duration: 0.06, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, DONE + 0.05);
        tl.to("#c1", { opacity: 0, y: -40, duration: 0.3 }, DONE - 0.1);
        tl.fromTo("#c2", { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, DONE + 0.2);
        tl.to("#veil", { backgroundColor: "rgba(243,239,252,0.8)", duration: 0.3 }, DONE + 0.1);
        // yeni hane açılıyor
        const OPEN = 7.6;
        tl.to(["#c2", "#check"], { opacity: 0, duration: 0.3 }, OPEN);
        tl.to("#badge", { opacity: 0, scale: 0.9, duration: 0.3 }, OPEN);
        tl.fromTo("#badge5", { opacity: 0, scaleX: 0.8 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: "back.out(1.6)" }, OPEN + 0.15);
        tl.to("#badge5", { opacity: 0, duration: 0.25 }, 8.9);
        tl.fromTo("#badge-new", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 8.95);
        tl.fromTo("#glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.8 }, 8.95);
        // kapılar açılıyor: mozaik dağılır
        for (let i = 0; i < N; i++) {
          const ang = (i * 137.5) % 360, rad = ang * Math.PI / 180;
          tl.to("#m" + i, { x: Math.cos(rad) * 900, y: Math.sin(rad) * 900, opacity: 0, duration: 1.4, ease: "power2.in" }, 9.0 + (i % 12) * 0.02);
        }
        tl.to("#veil", { backgroundColor: "rgba(243,239,252,0)", duration: 0.6 }, 9.2);
        // metinler
        tl.fromTo("#c3", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 9.0);
        tl.to("#c3", { opacity: 0, y: -30, duration: 0.3 }, 13.4);
        tl.fromTo("#c4", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 11.2);
        tl.to("#c4", { opacity: 0, y: -30, duration: 0.3 }, 13.4);
        tl.fromTo("#c5", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 13.75);
        tl.fromTo("#badge-new", { scale: 1 }, { scale: 1.05, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 13.8);
        tl.fromTo(["#b1", "#b2"], { x: 0 }, { x: 60, duration: END, ease: "sine.inOut" }, 0);
        tl.set({}, {}, END);
        window.__timelines["nm"] = tl;
      }
