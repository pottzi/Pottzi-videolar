        face("open", "flat", 0);
        tl.set("#c-g-pupils", { y: -6 }, 0);
        tl.fromTo("#c-g-head", { y: 0 }, { y: 3, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 11 }, 0);
        [1.6, 4.2, 7.9, 11.6, 16.2].forEach(blink);
        face("open", "sad", 3.6);
        tl.to("#c-g-brows", { y: 4, rotation: 0, duration: 0.4 }, 3.6);
        tl.to(["#c-g-head", "#c-g-hairback"], { rotation: -5, svgOrigin: "0 95", duration: 0.6, ease: "power2.inOut" }, 4.2);
        tl.to(["#c-g-head", "#c-g-hairback"], { rotation: 0, svgOrigin: "0 95", duration: 0.5, ease: "power2.inOut" }, TM);
        face("open", "flat", TM + 0.4);
        tl.to("#c-g-brows", { y: 0, duration: 0.4 }, R[0]);
        face("open", "smile", R[0] + 0.3);
        face("happy", "smile", R[2] + 0.3);
        tl.to(["#c-g-head", "#c-g-hairback"], { rotation: 4, svgOrigin: "0 95", duration: 0.6, ease: "power2.inOut" }, R[2] + 0.3);

        // --- Pottzi: Talk to Many ---
        tl.fromTo("#s-tm", { xPercent: 100 }, { xPercent: 0, duration: 0.45, ease: "power3.inOut" }, TM);
        tl.fromTo("#s-feed", { xPercent: 0 }, { xPercent: -30, duration: 0.45, ease: "power3.inOut" }, TM);
        tl.fromTo(["#t-b1", "#t-b2", "#t-b3", "#t-b4"], { y: 0 }, { y: -12, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.2 }, TM);
        tl.fromTo("#t-plus", { scale: 1 }, { scale: 0.88, duration: 0.1, yoyo: true, repeat: 1 }, TM + 0.7);
        tl.fromTo("#t-tap", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 2.4, duration: 0.45, immediateRender: false }, TM + 0.7);
        tl.to(["#t-b1", "#t-b2", "#t-b3", "#t-b4"], { opacity: 0.35, duration: 0.3 }, TM + 0.9);
        tl.fromTo("#t-new", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, TM + 0.9);
        const nt = document.getElementById("t-newtxt"), full = "Bazen herkesin içinde görünmez hissediyorum";
        const tc = { n: 0 };
        tl.fromTo(tc, { n: 0 }, { n: full.length, duration: 1.1, ease: "none", onUpdate: () => { nt.textContent = full.slice(0, Math.round(tc.n)); } }, TM + 1.2);
        tl.fromTo("#t-new", { scale: 1 }, { scale: 0.94, duration: 0.1, yoyo: true, repeat: 1, immediateRender: false }, ROOM - 0.35);

        // --- Düşünce odası ---
        tl.fromTo("#s-room", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out", transformOrigin: "50% 40%" }, ROOM - 0.2);
        const step = 165, y0 = 30;
        R.forEach((t, i) => {
          tl.fromTo("#r-c" + i, { opacity: 0, y: y0 - 40, scale: 0.9 }, { opacity: 1, y: y0, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, t);
          for (let j = 0; j < i; j++) tl.to("#r-c" + j, { y: y0 + (i - j) * step, duration: 0.4, ease: "power2.inOut" }, t);
        });
        tl.fromTo("#c-warm", { opacity: 0 }, { opacity: 1, duration: 2.5 }, R[0]);
        tl.to("#c-cold", { opacity: 0, duration: 2.0 }, R[0]);
        tl.fromTo(["#c-blob1", "#c-blob2"], { opacity: 0 }, { opacity: 1, duration: 2.5 }, R[1]);

        // --- final ---
        tl.fromTo("#c-dim", { opacity: 0 }, { opacity: 1, duration: 0.6 }, FIN);
        tl.fromTo("#c-final", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, FIN + 0.2);

        tl.set({}, {}, END);
        window.__timelines["cm"] = tl;
      }
      document.fonts.ready.then(build);
    })();
  </script>
</template>
