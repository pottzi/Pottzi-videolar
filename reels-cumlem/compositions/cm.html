    (function () {
      const tl = gsap.timeline({ paused: true });
      function build() {
        const END = 25.9, TM = 6.9, NEW = 8.5, SHARE = 11.5, POP = 11.85, ROOM = 13.3, FIN = 21.9;
        const R = [13.9, 15.9, 17.9, 19.9];

        // --- akış: mutlu fotoğraf, beğeniler ---
        const likes = document.getElementById("f-likes");
        const lc = { v: 248 };
        tl.fromTo(lc, { v: 248 }, { v: 1204, duration: 5.6, ease: "power1.in", onUpdate: () => { likes.textContent = Math.round(lc.v).toLocaleString("tr-TR") + " beğeni"; } }, 0.2);
        ["#f-h1", "#f-h2", "#f-h3"].forEach((h, i) => {
          for (let r = 0; r < 3; r++) tl.fromTo(h, { opacity: 0, y: 0, scale: 0.6 }, { opacity: 0.95, y: -140, scale: 1, duration: 0.7, ease: "power1.out", immediateRender: r === 0 && i === 0 }, 0.4 + i * 0.35 + r * 1.3);
          for (let r = 0; r < 3; r++) tl.to(h, { opacity: 0, duration: 0.25 }, 1.1 + i * 0.35 + r * 1.3);
        });
        ["#f-c1", "#f-c2", "#f-c3", "#f-c4"].forEach((c, i) => tl.fromTo(c, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 3.4 + i * 0.45));
        tl.fromTo("#s-feed-gray", { opacity: 0 }, { opacity: 1, duration: 1.2 }, 3.6);
        tl.fromTo("#c-cold", { opacity: 0 }, { opacity: 1, duration: 1.2 }, 3.6);

        // altyazılar
        tl.fromTo("#c-cap1 span", { y: 0 }, { y: -6, duration: 3, ease: "sine.inOut" }, 0);
        tl.to("#c-cap1", { opacity: 0, y: -30, duration: 0.3 }, 3.15);
        tl.fromTo("#c-cap2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.3);
        tl.to("#c-cap2", { opacity: 0, y: -30, duration: 0.3 }, 6.35);
        tl.fromTo("#c-cap3", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 6.5);
        tl.to("#c-cap3", { opacity: 0, y: -30, duration: 0.3 }, 11.55);
        tl.fromTo("#c-cap4", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 15.15);
        tl.to("#c-cap4", { opacity: 0, y: -30, duration: 0.3 }, 21.5);

        // --- kız: ifadeler ---
        const P = ["#c-g-eo", "#c-g-eh", "#c-g-mf", "#c-g-msad", "#c-g-ms"];
        function face(eyes, mouth, t) {
          tl.set(P[0], { opacity: eyes === "open" ? 1 : 0 }, t); tl.set(P[1], { opacity: eyes === "happy" ? 1 : 0 }, t);
          ["flat", "sad", "smile"].forEach((m, i) => tl.set(P[2 + i], { opacity: mouth === m ? 1 : 0 }, t));
        }
        function blink(t) { tl.fromTo("#c-g-eo", { scaleY: 1 }, { scaleY: 0.1, duration: 0.07, yoyo: true, repeat: 1, transformOrigin: "50% 50%", immediateRender: false }, t); }
        face("open", "flat", 0);
        tl.set("#c-g-pupils", { y: -6 }, 0);
        tl.fromTo("#c-g-head", { y: 0 }, { y: 3, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 15 }, 0);
        [1.4, 5.8, 9.9, 12.4, 15.6, 18.8, 23.2].forEach(blink);
        face("open", "sad", 3.3);
        tl.to("#c-g-brows", { y: 4, duration: 0.4 }, 3.3);
        tl.to(["#c-g-head", "#c-g-hairback"], { rotation: -5, svgOrigin: "0 95", duration: 0.6, ease: "power2.inOut" }, 3.6);
        // gözyaşı
        tl.fromTo("#c-g-tear", { opacity: 0, y: 0 }, { opacity: 0.95, y: 0, duration: 0.3 }, 4.4);
        tl.to("#c-g-tear", { y: 40, duration: 1.6, ease: "power1.in" }, 4.7);
        tl.to("#c-g-tear", { opacity: 0, duration: 0.3 }, 6.1);
        // karar
        tl.to(["#c-g-head", "#c-g-hairback"], { rotation: 0, svgOrigin: "0 95", duration: 0.5, ease: "power2.inOut" }, TM);
        face("open", "flat", TM + 0.2);
        tl.to("#c-g-brows", { y: 0, duration: 0.4 }, R[0]);
        face("open", "smile", R[0] + 0.4);
        face("happy", "smile", R[2] + 0.3);
        tl.to(["#c-g-head", "#c-g-hairback"], { rotation: 4, svgOrigin: "0 95", duration: 0.6, ease: "power2.inOut" }, R[2] + 0.3);

        // --- Pottzi: Talk to Many ---
        tl.fromTo("#s-tm", { xPercent: 100 }, { xPercent: 0, duration: 0.45, ease: "power3.inOut" }, TM);
        tl.fromTo("#s-feed", { xPercent: 0 }, { xPercent: -30, duration: 0.45, ease: "power3.inOut" }, TM);
        tl.fromTo(["#t-b1", "#t-b2", "#t-b3", "#t-b4", "#t-b5", "#t-b6"], { y: 0 }, { y: -12, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.15 }, TM);
        tl.fromTo("#t-plus", { scale: 1 }, { scale: 0.88, duration: 0.1, yoyo: true, repeat: 1 }, NEW - 0.35);
        tl.fromTo("#t-tap", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 2.4, duration: 0.45, immediateRender: false }, NEW - 0.35);

        // --- Yeni Konu Oluştur ---
        tl.fromTo("#s-new", { yPercent: 100 }, { yPercent: 0, duration: 0.45, ease: "power3.out" }, NEW);
        tl.set("#n-ph", { opacity: 0 }, NEW + 0.7);
        tl.fromTo("#n-caret", { opacity: 0 }, { opacity: 1, duration: 0.01 }, NEW + 0.6);
        const ty = document.getElementById("n-typed"), cv = document.getElementById("n-cntv");
        const Q = "Sevgilim beni terk etti. Ne yapabilirim?";
        const tc = { n: 0 };
        tl.fromTo(tc, { n: 0 }, { n: Q.length, duration: 1.9, ease: "none", onUpdate: () => { const k = Math.round(tc.n); ty.textContent = Q.slice(0, k); cv.textContent = k; } }, NEW + 0.7);
        tl.to("#n-btn", { opacity: 1, duration: 0.25 }, NEW + 2.65);
        tl.fromTo("#n-btn", { scale: 1 }, { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1, immediateRender: false }, SHARE);
        tl.fromTo("#n-tap", { opacity: 0.9, scale: 0.2 }, { immediateRender: false, opacity: 0, scale: 7, duration: 0.45 }, SHARE);
        tl.to("#s-new", { yPercent: 100, duration: 0.4, ease: "power3.in" }, SHARE + 0.25);

        // yeni balon
        tl.to(["#t-b1", "#t-b2", "#t-b3", "#t-b4", "#t-b5", "#t-b6"], { opacity: 0.35, duration: 0.3 }, POP);
        tl.fromTo("#t-new", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, POP);
        tl.fromTo("#t-new", { scale: 1 }, { scale: 0.94, duration: 0.1, yoyo: true, repeat: 1, immediateRender: false }, ROOM - 0.35);

        // --- Düşünce odası ---
        tl.fromTo("#s-room", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out", transformOrigin: "50% 40%" }, ROOM - 0.2);
        const step = 165, y0 = 30;
        R.forEach((t, i) => {
          tl.fromTo("#r-c" + i, { opacity: 0, y: y0 - 40, scale: 0.9 }, { opacity: 1, y: y0, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, t);
          for (let j = 0; j < i; j++) tl.to("#r-c" + j, { y: y0 + (i - j) * step, duration: 0.4, ease: "power2.inOut" }, t);
        });
        tl.fromTo("#c-warm", { opacity: 0 }, { opacity: 1, duration: 2.5 }, R[0]);
        tl.to("#c-cold", { opacity: 0, duration: 2.0 }, R[0]);
        tl.fromTo(["#c-blob1", "#c-blob2"], { opacity: 0 }, { opacity: 1, duration: 2.5 }, R[1]);

        // --- final ---
        tl.fromTo("#c-dim", { opacity: 0 }, { opacity: 1, duration: 0.6 }, FIN);
        tl.fromTo("#c-final", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, FIN + 0.2);

        tl.set({}, {}, END);
        window.__timelines["cm"] = tl;
      }
      document.fonts.ready.then(build);
    })();
  </script>
