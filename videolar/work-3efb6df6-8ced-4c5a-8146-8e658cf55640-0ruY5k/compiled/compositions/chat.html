      const END = 176;          // sayaç 00:00'a burada iner
      const TOTAL = 180;

      function build() {
        // arka plan hareketi
        tl.fromTo("#chat-blob1", { x: 0, y: 0 }, { x: 160, y: 220, duration: 22, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);
        tl.fromTo("#chat-blob2", { x: 0, y: 0 }, { x: -200, y: -160, duration: 26, ease: "sine.inOut", yoyo: true, repeat: 6 }, 0);
        tl.fromTo("#chat-blob3", { x: 0, y: 0, scale: 1 }, { x: -120, y: 140, scale: 1.25, duration: 18, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0);

        // sayaç
        const digits = document.getElementById("chat-timer-digits");
        const clock = { s: 180 };
        const fmt = (v) => { const s = Math.max(0, Math.ceil(v - 1e-6)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
        tl.fromTo(clock, { s: 180 }, { s: 0, duration: END, ease: "none", onUpdate: () => { digits.textContent = fmt(clock.s); } }, 0);
        tl.fromTo("#chat-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 578.05, duration: END, ease: "none" }, 0);

        tl.fromTo("#chat-ring", { stroke: "#ffffff" }, { stroke: "#ffe14d", duration: 0.6, ease: "none" }, END - 10);

        tl.fromTo(".dot", { y: 0 }, { y: -9, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: Math.floor(TOTAL / 0.3), stagger: 0.1 }, 0);

          const sel = DATA[i].who === "a" ? "#chat-typing-a" : "#chat-typing-b";
          const on = Math.max(DATA[i - 1].t + 0.7, DATA[i].t - 2.4);
          tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, on);
          tl.to(sel, { opacity: 0, duration: 0.15, ease: "none" }, DATA[i].t - 0.05);
        }

        // mesajlar ve kaydırma
        const H = document.getElementById("chat-viewport").clientHeight;
        const colTop = 80;
        let lastY = 0;

          const el = document.getElementById("m" + String(i).padStart(2, "0"));
          const bottom = colTop + el.offsetTop + el.offsetHeight;
          const y = Math.min(0, H - 40 - bottom);
          if (i === 0) { tl.set(el, { opacity: 1 }, 0); return; }
          if (y !== lastY) {
            tl.fromTo("#chat-col", { y: lastY }, { y: y, duration: 0.45, ease: "power3.out", immediateRender: false }, d.t - 0.05);
