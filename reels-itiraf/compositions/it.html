<template>
  <style>

    #rtitle { position: absolute; left: 110px; right: 110px; top: 116px; text-align: center; font-size: 68px; font-weight: 600; line-height: 1.12;
      text-shadow: 0 4px 18px rgba(80,30,100,0.3); }

    #panel { position: absolute; left: 0; right: 0; top: 330px; bottom: 0; border-radius: 72px 72px 0 0; background: #fff; }

    .card { position: absolute; left: 40px; top: 366px; width: 610px; height: 290px; padding: 30px 40px 0 124px; border-radius: 58px; background: #fff;
      border: 2px solid #ECE8F3; box-shadow: 0 12px 28px rgba(150,110,200,0.18); }
    .card .orb { left: 36px; top: 40px; width: 62px; height: 62px; }
    .card .hd { display: flex; align-items: baseline; gap: 20px; white-space: nowrap; }
    .card .no { font-size: 40px; font-weight: 600; letter-spacing: 0.03em; }
    .card .tm { font-size: 30px; font-weight: 500; color: #4B2BAF; }
    .card .mr { position: absolute; right: 40px; top: 58px; }
    .card .tx { margin-top: 10px; font-size: 33px; font-weight: 500; line-height: 1.32; }

    #inbar { position: absolute; left: 0; right: 0; top: 1040px; bottom: 0; background: #fff; z-index: 50; }
    #inbar::before { content: ""; position: absolute; left: 0; right: 0; top: -40px; height: 40px; background: linear-gradient(180deg, rgba(255,255,255,0), #fff); }
    #inp { position: absolute; left: 40px; right: 40px; top: 30px; height: 112px; border-radius: 56px; border: 2px solid #ECE8F3; background: #fff;
      box-shadow: 0 10px 26px rgba(150,110,200,0.16); }
    #inglow { position: absolute; inset: -3px; border-radius: 58px; border: 3px solid #D857AE; box-shadow: 0 0 30px rgba(216,87,174,0.45); opacity: 0; }
    #avatar { position: absolute; left: 20px; top: 20px; width: 72px; height: 72px; border-radius: 50%; border: 2px solid #DCD5EA;
      background: linear-gradient(160deg, #F3C3DE, #9F7FD8); }
    #avatar::after { content: ""; position: absolute; right: -2px; bottom: 2px; width: 16px; height: 16px; border-radius: 50%; background: #39D46E; border: 2px solid #fff; }
    #ph { position: absolute; left: 118px; top: 34px; font-size: 32px; color: #8E8A9C; white-space: nowrap; }
    #typed { position: absolute; left: 118px; right: 130px; top: 34px; font-size: 32px; color: #15131F; white-space: nowrap; overflow: hidden; }
    #typed .c { display: none; }
    #caret { display: inline-block; width: 3px; height: 36px; background: #6A3BF0; vertical-align: -6px; margin-left: 2px; opacity: 0; }
    #send { position: absolute; right: 14px; top: 14px; width: 84px; height: 84px; border-radius: 50%; background: #5B2DE0; display: flex; align-items: center; justify-content: center; }
    #hint { position: absolute; left: 0; right: 0; top: 166px; text-align: center; font-size: 26px; color: #78748C; }

    #cap { position: absolute; inset: 0; pointer-events: none; z-index: 60; }
    .grp { position: absolute; left: 40px; right: 40px; top: 900px; display: flex; justify-content: center; opacity: 0; visibility: hidden; }
    .box { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; padding: 12px 16px; border-radius: 30px; background: rgba(18,15,26,0.88); box-shadow: 0 14px 40px rgba(40,20,70,0.35); }
    .w { position: relative; display: inline-block; padding: 6px 14px 10px; font-size: 62px; font-weight: 800; line-height: 1.05; color: #fff; letter-spacing: 0.01em; }
    .w .bg { position: absolute; inset: 0; border-radius: 16px; background: linear-gradient(90deg, #704BEF, #DA5BAC); box-shadow: 0 10px 28px rgba(112,75,239,0.45);
      opacity: 0; transform: scaleX(0); transform-origin: 0% 50%; z-index: 0; }
    .w .tx { position: relative; z-index: 1; }
  </style>
  <div id="itroot" data-composition-id="it" data-width="1080" data-height="1350">
    <div id="topbar">
      <div class="orb o-purple" id="ob1" style="left:26px; top:150px; width:66px; height:66px"></div>
      <div class="orb o-blue" id="ob2" style="right:14px; top:120px; width:88px; height:88px"></div>
      <div class="orb o-grey" id="ob3" style="right:30px; top:250px; width:44px; height:44px"></div>
      <div class="orb o-pink" id="ob4" style="left:120px; top:292px; width:54px; height:54px"></div>
      <svg id="chev" width="40" height="56" viewBox="0 0 20 28"><path d="M15 3L4 14l11 11" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg id="dots" width="44" height="12" viewBox="0 0 44 12"><circle cx="6" cy="6" r="5" fill="#fff"/><circle cx="22" cy="6" r="5" fill="#fff"/><circle cx="38" cy="6" r="5" fill="#fff"/></svg>
      <div id="pill"><svg width="36" height="34" viewBox="0 0 24 22"><path d="M2 3a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7l-4 3v-3H4a2 2 0 0 1-2-2z" fill="#fff"/><path d="M18 6h2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-1v3l-4-3H10a2 2 0 0 1-2-2v-1h6a4 4 0 0 0 4-4z" fill="#fff"/></svg>Düşünce odası</div>
      <div id="rtitle">Aldatılan var mı,<br>benim gibi?</div>
    </div>
    <div id="panel"></div>
    <div id="cards"></div>

    <div id="inbar">
      <div id="inp"><div id="inglow"></div>
        <div id="avatar"></div>
        <div id="ph">Bu odaya düşünceni bırak...</div>
        <div id="typed"></div>
        <div id="send"><svg width="40" height="40" viewBox="0 0 24 24"><path d="M21 3L3 10.5l7 2.5 2.5 7z" fill="#fff"/><path d="M10 13l5-5" stroke="#5B2DE0" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      </div>
      <div id="hint">Yeni düşünce paylaştığında en üste gelir.</div>
    </div>
    <div id="cap"></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      function build() {
        const END = 11.85;
        // --- altyazı (ses parçalarının yerleştirildiği zamana göre)
        const W = [["Kızlar,",0.25,0.75],["burada",0.93,1.21],["kimse",1.21,1.83],["kim",1.83,2.07],["olduğunu",2.07,2.41],["bilmiyor.",2.41,2.99],
          ["O",3.57,3.71],["yüzden",3.71,3.97],["herkes",3.97,4.41],["içinden",4.41,4.93],["geçeni",4.93,5.35],["yazıyor.",5.35,5.91],
          ["Ve",6.03,6.25],["tanımadığın",6.25,6.95],["insanlar",6.95,7.37],["cevap",7.37,7.83],["veriyor.",7.83,8.21],
          ["Sen",9.11,9.29],["de",9.29,9.47],["yaz.",9.47,9.63]].map(a => ({ text: a[0], start: a[1], end: a[2] }));
        const G = [[0,0],[1,2],[3,5],[6,8],[9,11],[12,14],[15,16],[17,19]];
        const cap = document.getElementById("cap");
        G.forEach((g, gi) => {
          const el = document.createElement("div"); el.className = "grp"; el.id = "g" + gi;
          const box = document.createElement("div"); box.className = "box";
          for (let i = g[0]; i <= g[1]; i++) {
            const w = document.createElement("span"); w.className = "w"; w.id = "w" + i;
            w.innerHTML = '<span class="bg" id="bg' + i + '"></span><span class="tx"></span>';
            w.querySelector(".tx").textContent = W[i].text.toLocaleUpperCase("tr-TR");
            box.appendChild(w);
          }
          el.appendChild(box); cap.appendChild(el);
          const start = W[g[0]].start, nx = gi + 1 < G.length ? W[G[gi + 1][0]].start : Infinity;
          const end = Math.min(W[g[1]].end + 0.45, nx - 0.04);
          tl.set(el, { visibility: "visible" }, start);
          tl.fromTo(el, { opacity: 0, y: 18, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.14, ease: "power2.out" }, start);
          for (let i = g[0]; i <= g[1]; i++) {
            const bg = "#bg" + i, w = W[i];
            tl.to(bg, { opacity: 1, scaleX: 1, duration: Math.min(0.14, w.end - w.start), ease: "power2.out" }, w.start);
            tl.fromTo("#w" + i, { scale: 1 }, { scale: 1.07, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, w.start);
            if (i < g[1]) { tl.to(bg, { opacity: 0, duration: 0.08 }, W[i + 1].start); tl.set(bg, { scaleX: 0 }, W[i + 1].start + 0.08); }
          }
          tl.to(el, { opacity: 0, duration: 0.08 }, end - 0.08);
          tl.set(el, { visibility: "hidden" }, end);
        });

        // --- düşünce kartları: sırayla sol/sağ, en yeni en üstte
        // [id, numara, zaman, küre, metin, geliş saniyesi (null = başta var)]
        const C = [
          ["k0", "P-8815", "1 sa önce", "o-green", "Herkes “unut gitsin” diyor. Keşke o kadar kolay olsa.", null],
          ["k1", "P-6142", "21 dk önce", "o-blue", "En yakın arkadaşımlaymış. İkisini birden kaybettim.", null],
          ["k2", "P-3307", "8 dk önce", "o-pink", "Aylarca “suç bende mi” diye kendimi sorguladım.", null],
          ["k3", "P-1274", "şimdi", "o-purple", "Ben de yaşadım. Geçiyor, söz veriyorum.", 1.5],
          ["k4", "P-9530", "şimdi", "o-green", "Suçlu sen değilsin. Bunu bil yeter.", 4.5],
          ["k5", "P-4461", "şimdi", "o-blue", "Bu odayı görünce yalnız olmadığımı anladım.", 6.6],
          ["k6", "P-5420", "şimdi", "o-pink", "3 yıl sonra ilk kez birine anlattım.", 10.5],
        ];
        const wrap = document.getElementById("cards");
        const dots = '<svg class="mr" width="34" height="10" viewBox="0 0 34 10"><circle cx="5" cy="5" r="4" fill="#4B2BAF"/><circle cx="17" cy="5" r="4" fill="#4B2BAF"/><circle cx="29" cy="5" r="4" fill="#4B2BAF"/></svg>';
        C.forEach(c => {
          const el = document.createElement("div"); el.className = "card"; el.id = c[0];
          el.innerHTML = '<div class="orb ' + c[3] + '"></div><div class="hd"><span class="no"></span><span class="tm"></span></div>' + dots + '<div class="tx"></div>';
          el.querySelector(".no").textContent = c[1]; el.querySelector(".tm").textContent = c[2]; el.querySelector(".tx").textContent = c[4];
          wrap.appendChild(el);
        });
        const pos = k => ({ x: (k % 2) * 390, y: k * 236 });
        // başlangıç: k2 en üstte (slot 0), k1 slot 1, k0 slot 2
        const order = ["k2", "k1", "k0"];
        order.forEach((id, k) => { const p = pos(k); gsap.set("#" + id, { x: p.x, y: p.y, zIndex: 10 + k }); });
        C.forEach(c => { if (c[5] !== null) gsap.set("#" + c[0], { opacity: 0, zIndex: 9 }); });
        tl.fromTo("#cards", { y: 16 }, { y: 0, duration: 0.35, ease: "power3.out" }, 0);
        // yeni düşünce gelince herkes bir sıra aşağı (ve karşı tarafa) kayar
        C.filter(c => c[5] !== null).forEach(c => {
          const t = c[5];
          order.forEach((id, k) => {
            const p = pos(k + 1);
            tl.set("#" + id, { zIndex: 10 + k + 1 }, t);
            tl.to("#" + id, { x: p.x, y: p.y, duration: 0.5, ease: "power3.inOut" }, t);
          });
          order.unshift(c[0]);
          tl.set("#" + c[0], { zIndex: 10 }, t);
          tl.fromTo("#" + c[0], { x: 0, y: -40, opacity: 0, scale: 0.94 }, { x: 0, y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, t + 0.2);
          tl.fromTo("#" + c[0], { boxShadow: "0 12px 28px rgba(150,110,200,0.18)" }, { boxShadow: "0 0 0 4px rgba(216,87,174,0.55), 0 16px 40px rgba(216,87,174,0.35)", duration: 0.3, yoyo: true, repeat: 1, immediateRender: false }, t + 0.5);
        });
        ["#ob1", "#ob2", "#ob3", "#ob4"].forEach((o, i) => tl.fromTo(o, { y: 0 }, { y: i % 2 ? 12 : -12, duration: END, ease: "sine.inOut" }, 0));

        // --- sen de yaz: kutuya yazılır, gönderilir, en üste gelir (k6)
        tl.fromTo("#inglow", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 8.8);
        tl.to("#ph", { opacity: 0, duration: 0.1 }, 9.05);
        const txt = C[6][4];
        const typed = document.getElementById("typed");
        const T0 = 9.1, DT = 0.03;
        for (let i = 0; i < txt.length; i++) {
          const s = document.createElement("span"); s.className = "c"; s.textContent = txt[i]; typed.appendChild(s);
          tl.set(s, { display: "inline" }, T0 + i * DT);
        }
        const caret = document.createElement("span"); caret.id = "caret"; typed.appendChild(caret);
        tl.set("#caret", { opacity: 1 }, T0);
        const TE = T0 + txt.length * DT; // ~10.18
        tl.fromTo("#send", { scale: 1 }, { scale: 0.86, duration: 0.09, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, TE + 0.12);
        tl.set(["#typed", "#caret"], { opacity: 0 }, TE + 0.25);
        tl.set("#ph", { opacity: 1 }, TE + 0.3);
        tl.to("#inglow", { opacity: 0, duration: 0.3 }, TE + 0.3);
        tl.set({}, {}, END);
        window.__timelines["it"] = tl;
      }
      document.fonts.ready.then(build);
    })();
  </script>
</template>
