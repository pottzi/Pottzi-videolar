  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      function build() {
        const END = 11.85;
        // --- altyazı (ses parçalarının yerleştirildiği zamana göre)
        const W = [["Kızlar,",0.25,0.75],["burada",0.93,1.21],["kimse",1.21,1.83],["kim",1.83,2.07],["olduğunu",2.07,2.41],["bilmiyor.",2.41,2.99],

          ["Sen",9.11,9.29],["de",9.29,9.47],["yaz.",9.47,9.63]].map(a => ({ text: a[0], start: a[1], end: a[2] }));
        const G = [[0,0],[1,2],[3,5],[6,8],[9,11],[12,14],[15,16],[17,19]];
        const cap = document.getElementById("cap");
        G.forEach((g, gi) => {
          const el = document.createElement("div"); el.className = "grp"; el.id = "g" + gi; const box = document.createElement("div"); box.className = "box";
          for (let i = g[0]; i <= g[1]; i++) {
            const w = document.createElement("span"); w.className = "w"; w.id = "w" + i;
            w.innerHTML = '<span class="bg" id="bg' + i + '"></span><span class="tx"></span>';
            w.querySelector(".tx").textContent = W[i].text.toLocaleUpperCase("tr-TR");
            box.appendChild(w);
          }
          el.appendChild(box); cap.appendChild(el);
          const start = W[g[0]].start, nx = gi + 1 < G.length ? W[G[gi + 1][0]].start : Infinity;
          const end = Math.min(W[g[1]].end + 0.45, nx - 0.04);
          tl.set(el, { visibility: "visible" }, start);
          tl.fromTo(el, { opacity: 0, y: 18, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.14, ease: "power2.out" }, start);
          for (let i = g[0]; i <= g[1]; i++) {
            const bg = "#bg" + i, w = W[i];
            tl.to(bg, { opacity: 1, scaleX: 1, duration: Math.min(0.14, w.end - w.start), ease: "power2.out" }, w.start);
            tl.fromTo("#w" + i, { scale: 1 }, { scale: 1.07, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, w.start);
            if (i < g[1]) { tl.to(bg, { opacity: 0, duration: 0.08 }, W[i + 1].start); tl.set(bg, { scaleX: 0 }, W[i + 1].start + 0.08); }
          }
          tl.to(el, { opacity: 0, duration: 0.08 }, end - 0.08);
          tl.set(el, { visibility: "hidden" }, end);

        // --- sahne 1: oda ve itiraflar (ilk karede kart A zaten görünür: hook)

        // --- sahne 2: kart A öne çıkar, yorumlar gelir
        const F = 3.35;
        tl.to("#cB", { x: 420, opacity: 0, duration: 0.45, ease: "power2.in" }, F);
        tl.to("#cC", { x: -420, opacity: 0, duration: 0.45, ease: "power2.in" }, F + 0.05);
        tl.to("#cA", { width: 1000, duration: 0.55, ease: "power3.inOut" }, F + 0.2);
        tl.to("#comlbl", { opacity: 1, duration: 0.3 }, F + 0.75);
        [["#k1", 5.45], ["#k2", 6.25], ["#k3", 7.05]].forEach(([k, t]) =>
          tl.fromTo(k, { y: 50, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, t));

        // --- sahne 3: geri akışa dön, sen de yaz
        const B = 8.35;
        tl.to(["#k1", "#k2", "#k3", "#comlbl"], { opacity: 0, y: 30, duration: 0.3, ease: "power2.in", stagger: 0.04 }, B);
        tl.to("#cA", { width: 740, duration: 0.5, ease: "power3.inOut" }, B + 0.15);
        tl.to("#cB", { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, B + 0.3);
        tl.to("#cC", { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, B + 0.4);
        tl.fromTo("#inglow", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 8.85);
        tl.to("#ph", { opacity: 0, duration: 0.1 }, 9.05);
        // yazma
        const txt = "Ben de itiraf edeyim: Hâlâ çocukluk ayıcığımla uyuyorum.";
        const typed = document.getElementById("typed");
        const T0 = 9.1, DT = 0.026;
        for (let i = 0; i < txt.length; i++) {
          const s = document.createElement("span"); s.className = "c"; s.id = "ch" + i; s.textContent = txt[i]; typed.appendChild(s);
          tl.set(s, { opacity: 1 }, T0 + i * DT);
        }
        const caret = document.createElement("span"); caret.id = "caret"; typed.appendChild(caret);
        tl.set("#caret", { opacity: 1 }, T0);
        const TE = T0 + txt.length * DT; // ~10.56
        // yazı taşarsa sola kaydır
        tl.fromTo("#typed", { scrollLeft: 0 }, { scrollLeft: 260, duration: TE - T0 - 0.85, ease: "none" }, T0 + 0.85);
        tl.fromTo("#send", { scale: 1 }, { scale: 0.86, duration: 0.09, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, TE + 0.12);
        tl.set(["#typed", "#caret"], { opacity: 0 }, TE + 0.25);
        tl.set("#ph", { opacity: 1 }, TE + 0.3);
        tl.to("#inglow", { opacity: 0, duration: 0.3 }, TE + 0.3);
        // yeni düşünce en üste gelir, diğerleri aşağı kayar
        const N = TE + 0.3;
        tl.to("#cA", { x: 260, y: 194, duration: 0.45, ease: "power3.inOut" }, N);
        tl.to("#cB", { x: -260, y: 194, duration: 0.45, ease: "power3.inOut" }, N);
        tl.to("#cC", { x: 260, y: 194, duration: 0.45, ease: "power3.inOut" }, N);
        tl.fromTo("#cN", { y: -60, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, N + 0.15);
        tl.fromTo("#cN", { boxShadow: "0 0 0 0 rgba(216,87,174,0)" }, { boxShadow: "0 0 50px 6px rgba(216,87,174,0.6)", duration: 0.35, yoyo: true, repeat: 1, immediateRender: false }, N + 0.5);
        tl.set({}, {}, END);
        window.__timelines["it"] = tl;
