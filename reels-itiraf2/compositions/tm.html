    (function () {
      const tl = gsap.timeline({ paused: true });

        const END = 12.45, S2 = 5.5;
        // --- altyazı: [kelime, başlangıç, bitiş] (ses parçalarının yerleştiği zamanlar)
        const A = 0.2, B = 0.6, C = 1.6;
        const W = [["Kızlar,",0,0.5,A],["bunu",0.78,1.06,A],["kimseye",1.06,1.6,A],["soramadım.",1.6,2.16,A],
          ["Acaba",2.5,2.92,A],["benim",2.92,3.3,A],["gibi",3.3,3.54,A],["bu",3.54,3.82,A],["duyguyu",3.82,4.2,A],["yaşayan",4.2,4.64,A],["var",4.64,4.88,A],["mı?",4.88,5.14,A],
          ["Sonra",5.56,5.84,B],["tek",5.84,6.3,B],["tek",6.3,6.6,B],["cevaplar",6.6,7.18,B],["gelmeye",7.18,7.52,B],["başladı.",7.52,8.06,B],
          ["Meğer",8.42,8.84,C],["hiç",8.84,9.12,C],["yalnız",9.12,9.54,C],["değilmişim.",9.54,10.24,C]].map(a => ({ text: a[0], start: a[1] + a[3], end: a[2] + a[3] }));
        const G = [[0,0,1],[1,3,1],[4,6,1],[7,11,1],[12,14,0],[15,17,0],[18,19,0],[20,21,0]];
        const cap = document.getElementById("cap");
        G.forEach((g, gi) => {
          const el = document.createElement("div"); el.className = "grp" + (g[2] ? " ust" : ""); el.id = "g" + gi;
          const box = document.createElement("div"); box.className = "box";
          for (let i = g[0]; i <= g[1]; i++) {
            const w = document.createElement("span"); w.className = "w"; w.id = "w" + i;
            w.innerHTML = '<span class="bg" id="bg' + i + '"></span><span class="tx"></span>';
            w.querySelector(".tx").textContent = W[i].text.toLocaleUpperCase("tr-TR");
            box.appendChild(w);
          }
          el.appendChild(box); cap.appendChild(el);
          const start = W[g[0]].start, nx = gi + 1 < G.length ? W[G[gi + 1][0]].start : Infinity;
          const end = Math.min(W[g[1]].end + 0.45, nx - 0.04, gi === 3 ? S2 + 0.05 : Infinity);
          tl.set(el, { visibility: "visible" }, start);
          tl.fromTo(el, { opacity: 0, y: 18, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.14, ease: "power2.out" }, start);
          for (let i = g[0]; i <= g[1]; i++) {
            const bg = "#bg" + i, w = W[i];
            tl.to(bg, { opacity: 1, scaleX: 1, duration: Math.min(0.14, w.end - w.start), ease: "power2.out" }, w.start);
            tl.fromTo("#w" + i, { scale: 1 }, { scale: 1.07, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, w.start);
            if (i < g[1]) { tl.to(bg, { opacity: 0, duration: 0.08 }, W[i + 1].start); tl.set(bg, { scaleX: 0 }, W[i + 1].start + 0.08); }
          }
          tl.to(el, { opacity: 0, duration: 0.08 }, end - 0.08);
          tl.set(el, { visibility: "hidden" }, end);
        });

        // --- sahne 1: telefon
        tl.fromTo("#phone", { y: 60 }, { y: 0, duration: 0.45, ease: "power3.out" }, 0);
        tl.fromTo("#phone", { scale: 1 }, { scale: 1.03, duration: S2 - 0.8, ease: "sine.inOut", immediateRender: false }, 0.45);
        tl.fromTo("#b1", { x: 0, y: 0 }, { x: 80, y: 60, duration: S2, ease: "sine.inOut" }, 0);
        tl.fromTo("#b2", { x: 0, y: 0 }, { x: -70, y: -50, duration: S2, ease: "sine.inOut" }, 0);
        // geçiş: telefon büyüyerek odaya dönüşür
        tl.to("#phone", { scale: 1.35, y: -120, duration: 0.3, ease: "power3.in" }, S2 - 0.3);
        tl.fromTo("#s2", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, S2 - 0.1);
        tl.fromTo("#rtitle", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, S2 + 0.15);
        ["#ob1", "#ob2", "#ob3", "#ob4", "#ob5"].forEach((o, i) => tl.fromTo(o, { y: 0 }, { y: i % 2 ? 12 : -12, duration: END - S2, ease: "sine.inOut" }, S2));

        // --- sahne 2: boş oda, cevaplar tek tek en üste gelir (sol/sağ sırayla)

          ["k2", "P-4458", "o-pink", "Ben de yaşadım. Şimdi çok daha iyiyim, söz.", 8.3],
          ["k3", "P-1630", "o-purple", "Buraya yazman bile cesaret. Sana sarılıyorum.", 9.25],
          ["k4", "P-7305", "o-grey", "Dünyam yıkıldı sanmıştım. Yıkılmadı, seninki de yıkılmayacak.", 10.2],
        ];
        const wrap = document.getElementById("cards");
        const dots = '<svg class="mr" width="34" height="10" viewBox="0 0 34 10"><circle cx="5" cy="5" r="4" fill="#4B2BAF"/><circle cx="17" cy="5" r="4" fill="#4B2BAF"/><circle cx="29" cy="5" r="4" fill="#4B2BAF"/></svg>';
        C2.forEach(c => {
          const el = document.createElement("div"); el.className = "card"; el.id = c[0];
          el.innerHTML = '<div class="orb ' + c[2] + '"></div><div class="hd"><span class="no"></span><span class="tm2">şimdi</span></div>' + dots + '<div class="tx"></div>';
          el.querySelector(".no").textContent = c[1]; el.querySelector(".tx").textContent = c[3];
          wrap.appendChild(el);
        });
        const pos = k => ({ x: (k % 2) * 390, y: k * 236 });
        const order = [];
        C2.forEach(c => {
          const t = c[4];
          order.forEach((id, k) => {
            const p = pos(k + 1);
            tl.set("#" + id, { zIndex: 10 + k + 1 }, t);
            tl.to("#" + id, { x: p.x, y: p.y, duration: 0.5, ease: "power3.inOut" }, t);
          });
          order.unshift(c[0]);
          tl.set("#" + c[0], { zIndex: 10 }, t);
          tl.fromTo("#" + c[0], { x: 0, y: -40, opacity: 0, scale: 0.94 }, { x: 0, y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, order.length > 1 ? t + 0.2 : t);
          tl.fromTo("#" + c[0], { boxShadow: "0 12px 28px rgba(150,110,200,0.18)" }, { boxShadow: "0 0 0 4px rgba(216,87,174,0.55), 0 16px 40px rgba(216,87,174,0.35)", duration: 0.3, yoyo: true, repeat: 1, immediateRender: false }, t + 0.5);
        });
        tl.set({}, {}, END);
        window.__timelines["tm"] = tl;
      }
      document.fonts.ready.then(build);
    })();
