        for (let k = 0; k < 5; k++) tl.fromTo("#f-pill", { scale: 1 }, { scale: 1.12, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, T_FAST_END + k * 0.26);

        // Konu aç: ✨ butonuna dokunma
        tl.fromTo("#f-spark", { scale: 1 }, { scale: 0.88, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, T_LAND + 0.3);
        tl.fromTo("#f-spark-tap", { opacity: 0, scale: 1 }, { immediateRender: false, opacity: 0.9, scale: 1, duration: 0.01 }, T_LAND + 0.3);
        tl.to("#f-spark-tap", { opacity: 0, scale: 2.6, duration: 0.5, ease: "power2.out" }, T_LAND + 0.31);

        // mesajlar
        const H = document.getElementById("f-chat").clientHeight;
        const top0 = 36;
        let lastY = 0;
        MSGS.forEach((m, i) => {
          const el = document.getElementById(m.id);
          const bottom = top0 + el.offsetTop + el.offsetHeight;
          const y = Math.min(0, H - 30 - bottom);
          if (y !== lastY) {
            tl.fromTo("#f-col", { y: lastY }, { y: y, duration: 0.3, ease: "power3.out", immediateRender: false }, m.t - 0.04);
            lastY = y;
          }
          tl.fromTo(el, { opacity: 0, y: 30, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(1.8)",
            transformOrigin: m.al }, m.t);
        });

        // süre doldu ekranı
        const T_END = T_ZERO;
                tl.fromTo("#f-end", { yPercent: 100 }, { yPercent: 0, duration: 0.4, ease: "power3.out" }, T_END);
        tl.to(["#f-header", "#f-chat", "#f-bar-track"], { opacity: 0, duration: 0.01 }, T_END + 0.4);
        tl.fromTo("#f-e-pill", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, T_END + 0.2);
        tl.fromTo("#f-e-glass", { rotation: -180, scale: 0.6, opacity: 0 }, { rotation: 0, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.4)" }, T_END + 0.15);
        tl.fromTo(".f-dot", { y: 0 }, { y: -26, duration: 3.2, ease: "sine.inOut", stagger: 0.15 }, T_END + 0.3);
        tl.fromTo(["#f-e-id", "#f-e-title", "#f-e-sub", "#f-e-r1", "#f-e-r2", "#f-e-karar", "#f-e-btns"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.05 }, T_END + 0.3);
        const sn = document.getElementById("f-e-sn");
        const kc = { s: 30 };
        tl.fromTo(kc, { s: 30 }, { s: 27, duration: 3, ease: "none", onUpdate: () => { sn.textContent = Math.ceil(kc.s - 1e-6); } }, T_END + 0.9);
        // Devam Et'e dokunma
        const TAP = T_END + 1.35;
        tl.fromTo("#f-e-devam", { scale: 1 }, { scale: 0.94, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, TAP);
        tl.fromTo("#f-e-tap", { opacity: 0.9, scale: 0.2 }, { immediateRender: false, opacity: 0, scale: 6, duration: 0.5, ease: "power2.out" }, TAP);
        tl.to("#f-e-lbl1", { opacity: 0, duration: 0.12 }, TAP + 0.12);
        tl.fromTo("#f-e-lbl2", { opacity: 0 }, { opacity: 1, duration: 0.15 }, TAP + 0.18);
        // karşı taraf da devam etti
        tl.fromTo("#f-toast", { opacity: 0, y: -60, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, TAP + 0.55);

        tl.set({}, {}, 15.6);
        window.__timelines["film"] = tl;
      }
      document.fonts.ready.then(build);
    })();
  </script>
</template>
