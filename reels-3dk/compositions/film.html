    (function () {

      const T_IN = 2.1, T_LAND = 2.8, T_FAST_END = 10.0, T_ZERO = 11.3;
      const tl = gsap.timeline({ paused: true });

      function build() {
        // arka plan yavaş hareket
        tl.fromTo("#f-blob1", { x: 0, y: 0 }, { x: 120, y: 160, duration: 13, ease: "sine.inOut" }, 0);
        tl.fromTo("#f-blob2", { x: 0, y: 0 }, { x: -160, y: -120, duration: 13, ease: "sine.inOut" }, 0);
        tl.fromTo("#f-blob3", { x: 0, y: 0 }, { x: -100, y: 120, duration: 13, ease: "sine.inOut" }, 0);

        // kanca: ilk karede yazı hazır, hafif yaşar

        tl.fromTo("#f-hook-2", { scale: 1 }, { scale: 1.04, duration: 1.8, ease: "sine.inOut" }, 0);
        tl.fromTo("#f-bigpill", { scale: 1 }, { scale: 1.06, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 3 }, 0.6);
        tl.to("#f-hook", { opacity: 0, y: -90, duration: 0.3, ease: "power2.in" }, 1.85);

        // telefon aşağıdan gelir
        const phone = document.getElementById("f-phone");
        const pill = document.getElementById("f-pill").getBoundingClientRect();
        const big = document.getElementById("f-bigpill").getBoundingClientRect();
        tl.fromTo(phone, { y: 1800 }, { y: 0, duration: T_LAND - T_IN, ease: "power3.out" }, T_IN);
        // büyük sayaç başlıktaki sayaca uçar
        const dx = (pill.left + pill.width / 2) - (big.left + big.width / 2);
        const dy = (pill.top + pill.height / 2) - (big.top + big.height / 2);
        tl.fromTo("#f-bigpill", { x: 0, y: 0, scale: 1 }, { x: dx, y: dy, scale: pill.width / big.width, duration: T_LAND - T_IN, ease: "power3.inOut", immediateRender: false }, T_IN);
        tl.fromTo("#f-pill", { opacity: 0 }, { opacity: 1, duration: 0.05 }, T_LAND - 0.05);
        tl.to("#f-bigpill", { opacity: 0, duration: 0.05 }, T_LAND);

        // sayaç: 03:00 -> 00:10 hızlı, sonra 00:10 -> 00:00
        const d1 = document.getElementById("f-pill-digits");
        const fmt = (v) => { const s = Math.max(0, Math.ceil(v - 1e-6)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
        const clock = { s: 180 };
        tl.fromTo(clock, { s: 180 }, { s: 10, duration: T_FAST_END - T_LAND, ease: "power1.in", onUpdate: () => { d1.textContent = fmt(clock.s); } }, T_LAND);
        tl.fromTo(clock, { s: 10 }, { s: 0, duration: T_ZERO - T_FAST_END, ease: "none", immediateRender: false, onUpdate: () => { d1.textContent = fmt(clock.s); } }, T_FAST_END);
        tl.fromTo("#f-bar", { scaleX: 1 }, { scaleX: 10 / 180, duration: T_FAST_END - T_LAND, ease: "power1.in" }, T_LAND);
        tl.fromTo("#f-bar", { scaleX: 10 / 180 }, { scaleX: 0, duration: T_ZERO - T_FAST_END, ease: "none", immediateRender: false }, T_FAST_END);
        // son 10 saniye: kırmızı ve nabız
        tl.fromTo("#f-pill-hot", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T_FAST_END);
        for (let k = 0; k < 5; k++) tl.fromTo("#f-pill", { scale: 1 }, { scale: 1.12, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, T_FAST_END + k * 0.26);

        // mesajlar
        const H = document.getElementById("f-chat").clientHeight;
        const top0 = 36;
        let lastY = 0;
        MSGS.forEach((m, i) => {
          const el = document.getElementById("f-m" + i);
          const bottom = top0 + el.offsetTop + el.offsetHeight;
          const y = Math.min(0, H - 30 - bottom);
          if (y !== lastY) {
            tl.fromTo("#f-col", { y: lastY }, { y: y, duration: 0.3, ease: "power3.out", immediateRender: false }, m.t - 0.04);
            lastY = y;
          }
          tl.fromTo(el, { opacity: 0, y: 30, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(1.8)",
            transformOrigin: m.me ? "100% 100%" : "0% 100%" }, m.t);
        });

        // süre doldu
        tl.fromTo("#f-dim", { opacity: 0 }, { opacity: 1, duration: 0.25 }, T_ZERO);
        tl.fromTo("#f-modal", { opacity: 0, y: 80, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, T_ZERO + 0.05);
        tl.fromTo("#f-c1", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, T_ZERO + 0.45);
        tl.fromTo("#f-c2", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, T_ZERO + 0.75);
        tl.fromTo("#f-m-ok", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, T_ZERO + 0.95);

        tl.set({}, {}, 13.6);
        window.__timelines["film"] = tl;
      }
      document.fonts.ready.then(build);
    })();
