<!doctype html>
<html lang="tr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F3EFFC; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="26" data-width="1080" data-height="1920">
      <div id="kn" class="clip" data-composition-id="kn" data-composition-src="compositions/kn.html"
        data-start="0" data-duration="22.1" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="outro" class="clip" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="22.0" data-duration="4.0" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <audio id="k1" class="clip" src="assets/audio/k1.mp3" data-start="0.2" data-track-index="2" data-volume="1.4"></audio>
      <audio id="k2" class="clip" src="assets/audio/k2.mp3" data-start="13.65" data-track-index="3" data-volume="1.4"></audio>
      <audio id="k3" class="clip" src="assets/audio/k3.mp3" data-start="17.35" data-track-index="5" data-volume="1.4"></audio>
      <audio id="kapanis" class="clip" src="assets/audio/kapanis.mp3" data-start="22.3" data-track-index="4" data-volume="1.58"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
